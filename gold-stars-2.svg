<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" fill="none">
    <defs>
        <filter id="goldGlow2" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#d97706" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Star 1: Radiant 4-point sparkle (Top) -->
    <g transform="translate(140, 80)" filter="url(#goldGlow2)">
        <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#d97706"/>
        <path d="M 0,-11 Q 0,0 11,0 Q 0,0 0,11 Q 0,0 -11,0 Q 0,0 0,-11 Z" fill="#facc15"/>
        <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Star 2: 5-point star (Top Right) -->
    <g transform="translate(390, 70) scale(1.3)" filter="url(#goldGlow2)">
        <polygon points="0,-8 2.4,-2.4 8,-2.4 3.4,1 5,7 0,3.4 -5,7 -3.4,1 -8,-2.4 -2.4,-2.4" fill="#f59e0b"/>
        <circle cx="0" cy="0" r="1.5" fill="#fef9c3"/>
    </g>

    <!-- Star 3: Diamond shimmer rotated 45 deg -->
    <g transform="translate(265, 175) rotate(45)" filter="url(#goldGlow2)">
        <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#eab308"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>

    <!-- Star 4: 4-point sparkle (Right Center) -->
    <g transform="translate(460, 220)" filter="url(#goldGlow2)">
        <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#d97706"/>
        <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#facc15"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>

    <!-- Star 5: 5-point star (Left Center) -->
    <g transform="translate(75, 280) scale(1.25)" filter="url(#goldGlow2)">
        <polygon points="0,-8 2.4,-2.4 8,-2.4 3.4,1 5,7 0,3.4 -5,7 -3.4,1 -8,-2.4 -2.4,-2.4" fill="#eab308"/>
        <polygon points="0,-5 1.5,-1.5 5,-1.5 2.1,0.6 3.1,4.4 0,2.1 -3.1,4.4 -2.1,0.6 -5,-1.5 -1.5,-1.5" fill="#fef08a"/>
    </g>

    <!-- Star 6: Elegant Grand 4-point sparkle (Center Bottom) -->
    <g transform="translate(320, 335)" filter="url(#goldGlow2)">
        <path d="M 0,-22 Q 0,0 22,0 Q 0,0 0,22 Q 0,0 -22,0 Q 0,0 0,-22 Z" fill="#d97706"/>
        <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#facc15"/>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>

    <!-- Star 7: Cross sparkle (Lower Left) -->
    <g transform="translate(185, 425)">
        <path d="M 0,-9 L 0,9 M -9,0 L 9,0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Star 8: 4-point sparkle (Bottom Right) -->
    <g transform="translate(435, 430)" filter="url(#goldGlow2)">
        <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#f59e0b"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>

    <!-- Constellation Dots & Stardust -->
    <circle cx="220" cy="85" r="2.5" fill="#d97706" opacity="0.85"/>
    <circle cx="45" cy="175" r="2" fill="#eab308" opacity="0.8"/>
    <circle cx="345" cy="235" r="2.2" fill="#f59e0b" opacity="0.85"/>
    <circle cx="495" cy="345" r="2.5" fill="#d97706" opacity="0.85"/>
    <circle cx="120" cy="390" r="2.2" fill="#eab308" opacity="0.85"/>
    <circle cx="250" cy="485" r="2" fill="#f59e0b" opacity="0.8"/>
</svg>
