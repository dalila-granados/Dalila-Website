<svg xmlns="http://www.w3.org/2000/svg" width="450" height="450" viewBox="0 0 450 450" fill="none">
    <defs>
        <filter id="goldGlow3" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#d97706" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Star 1: Grand 8-point Radiant Star (Center Top) -->
    <g transform="translate(225, 90)" filter="url(#goldGlow3)">
        <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="#d97706"/>
        <path d="M 0,-13 Q 0,0 13,0 Q 0,0 0,13 Q 0,0 -13,0 Q 0,0 0,-13 Z" fill="#facc15"/>
        <path d="M -8,-8 L 8,8 M -8,8 L 8,-8" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>

    <!-- Star 2: 5-point star (Left Upper) -->
    <g transform="translate(75, 110) scale(1.35)" filter="url(#goldGlow3)">
        <polygon points="0,-8 2.4,-2.4 8,-2.4 3.4,1 5,7 0,3.4 -5,7 -3.4,1 -8,-2.4 -2.4,-2.4" fill="#f59e0b"/>
        <polygon points="0,-5 1.5,-1.5 5,-1.5 2.1,0.6 3.1,4.4 0,2.1 -3.1,4.4 -2.1,0.6 -5,-1.5 -1.5,-1.5" fill="#fef08a"/>
    </g>

    <!-- Star 3: Diamond Sparkle (Right Upper) -->
    <g transform="translate(370, 130) rotate(15)" filter="url(#goldGlow3)">
        <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="#eab308"/>
        <path d="M 0,-9 Q 0,0 9,0 Q 0,0 0,9 Q 0,0 -9,0 Q 0,0 0,-9 Z" fill="#fef08a"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>

    <!-- Star 4: 4-point Sparkle (Center) -->
    <g transform="translate(180, 230)" filter="url(#goldGlow3)">
        <path d="M 0,-17 Q 0,0 17,0 Q 0,0 0,17 Q 0,0 -17,0 Q 0,0 0,-17 Z" fill="#d97706"/>
        <path d="M 0,-11 Q 0,0 11,0 Q 0,0 0,11 Q 0,0 -11,0 Q 0,0 0,-11 Z" fill="#facc15"/>
        <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Star 5: 5-point Star (Right Center) -->
    <g transform="translate(330, 260) scale(1.2)" filter="url(#goldGlow3)">
        <polygon points="0,-8 2.4,-2.4 8,-2.4 3.4,1 5,7 0,3.4 -5,7 -3.4,1 -8,-2.4 -2.4,-2.4" fill="#eab308"/>
        <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Star 6: Radiant 4-point Star (Left Lower) -->
    <g transform="translate(100, 330)" filter="url(#goldGlow3)">
        <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#f59e0b"/>
        <path d="M 0,-11 Q 0,0 11,0 Q 0,0 0,11 Q 0,0 -11,0 Q 0,0 0,-11 Z" fill="#fef08a"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>

    <!-- Star 7: Cross Sparkle (Center Bottom) -->
    <g transform="translate(250, 370)">
        <path d="M 0,-10 L 0,10 M -10,0 L 10,0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="2" fill="#fffef0"/>
    </g>

    <!-- Star 8: Mini 4-point Sparkle (Right Bottom) -->
    <g transform="translate(385, 360)">
        <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" fill="#d97706"/>
        <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Cute Stardust & Tiny Floating Sparkles -->
    <circle cx="140" cy="60" r="2.5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="310" cy="70" r="2" fill="#fef08a" opacity="0.9"/>
    <circle cx="45" cy="220" r="2.2" fill="#eab308" opacity="0.85"/>
    <circle cx="410" cy="210" r="2.5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="280" cy="180" r="2" fill="#facc15" opacity="0.85"/>
    <circle cx="160" cy="390" r="2.5" fill="#d97706" opacity="0.85"/>
    <circle cx="320" cy="410" r="2.2" fill="#fef08a" opacity="0.9"/>
</svg>
